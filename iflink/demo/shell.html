<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>应用壳 · 小步星球</title>
    <meta name="color-scheme" content="light" />
    <!--
      应用壳独立 demo（成员 B）。

      这一页只做「页面结构 + 路由 + 顶部栏 + 加载/空/错误态」，
      不接真实摄像头、不接模型、不接情景选择、不写音效。

      样式与脚本全部内联，原因：本目录只允许改 demo/shell.html 一个文件，
      不能新增 shell.css / shell.js。所以页面自带样式，不依赖外部 CSS。
      不引用任何 CDN、字体或远程资源；断网也能打开。
    -->
    <style>
      /* ==================================================================
         设计基线（PRD §11 无障碍与感官友好）
         - 主要操作热区 ≥ 56px；按钮与文字足够大
         - 低饱和配色、无闪烁、无突然放大
         - 支持减少动态；手机竖屏与平板横屏都不横向溢出
         - 只用系统字体，不加载远程字体
         ================================================================== */
      :root {
        --bg: #f6f4ef;
        --surface: #ffffff;
        --surface-soft: #fbf9f5;
        --ink: #2f3336;
        --ink-soft: #5b6167;
        --ink-faint: #7b8188;
        --line: #e2ddd4;
        --line-strong: #cec7bb;

        --primary: #4a7c6f;
        --primary-strong: #3b6559;
        --primary-soft: #e8f0ed;

        --warn-soft: #fdf6e7;
        --warn-line: #e8d9b0;
        --warn-ink: #7a6220;

        --error-soft: #fbf1ef;
        --error-line: #e6cfc9;
        --error-ink: #7d4b41;

        --radius: 14px;
        --radius-lg: 20px;
        --gap: 16px;
        --tap: 56px;

        --shadow: 0 1px 2px rgba(47, 51, 54, 0.06), 0 6px 18px rgba(47, 51, 54, 0.06);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        /* 任何情况下都不横向溢出（PRD §11） */
        overflow-x: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Source Han Sans SC",
          "Noto Sans CJK SC", system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 17px;
        line-height: 1.6;
        -webkit-text-size-adjust: 100%;
        text-rendering: optimizeLegibility;
      }

      /* 文字长句在窄屏要能断行，避免撑破布局 */
      h1,
      h2,
      h3,
      p,
      span,
      strong,
      li,
      button {
        overflow-wrap: break-word;
        word-break: break-word;
      }

      /* ============================ 应用骨架 ============================ */

      .app {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
      }

      .app__main {
        flex: 1 1 auto;
        width: 100%;
        max-width: 880px;
        margin: 0 auto;
        padding: var(--gap);
        outline: none;
      }

      /* 键盘焦点可见（PRD §11 键盘可用） */
      :focus-visible {
        outline: 3px solid var(--primary);
        outline-offset: 3px;
        border-radius: 6px;
      }

      /* ============================== 顶部栏 ============================ */

      .topbar {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
      }

      .topbar__title {
        flex: 1 1 auto;
        margin: 0;
        font-size: 19px;
        font-weight: 600;
        text-align: center;
        min-width: 0;
      }

      .topbar__actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .topbar__btn {
        min-height: 44px;
        padding: 8px 14px;
        font: inherit;
        font-size: 15px;
        color: var(--ink);
        background: var(--surface-soft);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        cursor: pointer;
        white-space: nowrap;
      }

      .topbar__btn:hover:not(:disabled) {
        background: var(--primary-soft);
        border-color: var(--primary);
      }

      .topbar__btn:disabled {
        opacity: 0.45;
        cursor: default;
      }

      /* ============================== 通用按钮 ========================== */

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: var(--tap);
        padding: 14px 22px;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: var(--radius);
        cursor: pointer;
        text-align: center;
        /* 触控目标足够大；按下有明确但不夸张的反馈 */
        transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn--primary {
        color: #fff;
        background: var(--primary);
        border-color: var(--primary-strong);
      }

      .btn--primary:hover {
        background: var(--primary-strong);
      }

      .btn--ghost {
        background: transparent;
        border-color: var(--line-strong);
      }

      .btn--ghost:hover {
        background: var(--surface-soft);
      }

      .btn--quiet {
        min-height: 48px;
        font-size: 15px;
        font-weight: 500;
        color: var(--ink-soft);
        background: transparent;
        border-color: transparent;
      }

      .btn--quiet:hover {
        background: var(--surface-soft);
        border-color: var(--line);
      }

      .btn--large {
        min-height: 56px;
        font-size: 18px;
      }

      .btn--xlarge {
        min-height: 64px;
        padding: 18px 30px;
        font-size: 20px;
      }

      /* ================================ 页面 ============================ */

      .page {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      .page__heading {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        line-height: 1.35;
      }

      .page__heading--xl {
        font-size: 30px;
      }

      .page__lead {
        margin: 0;
        font-size: 18px;
        color: var(--ink-soft);
      }

      .page__todo {
        margin: 0;
        padding: 12px 14px;
        font-size: 15px;
        color: var(--warn-ink);
        background: var(--warn-soft);
        border: 1px solid var(--warn-line);
        border-radius: var(--radius);
      }

      .page__note {
        margin: 0;
        font-size: 14px;
        color: var(--ink-faint);
      }

      .page__actions,
      .page__links {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      /* 按钮在窄屏自动占满整行，避免挤成一团 */
      .page__actions > .btn,
      .page__links > .btn {
        flex: 1 1 220px;
      }

      .page__footer {
        margin-top: 8px;
        padding-top: var(--gap);
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: center;
      }

      /* ============================== 主页大按钮 ======================== */

      .tiles {
        display: grid;
        gap: var(--gap);
        grid-template-columns: 1fr;
      }

      .tile {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        /* 答案卡级别的热区（PRD §6.1：答案卡 ≥ 120px），主页入口同样够大 */
        min-height: 120px;
        padding: 22px;
        font: inherit;
        text-align: left;
        color: var(--ink);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
        cursor: pointer;
        transition: border-color 0.15s ease, background-color 0.15s ease;
      }

      .tile:hover {
        background: var(--surface-soft);
        border-color: var(--primary);
      }

      .tile__label {
        font-size: 21px;
        font-weight: 700;
      }

      .tile__hint {
        font-size: 15px;
        color: var(--ink-soft);
      }

      /* ============================ 加载/空/错误态 ====================== */

      .state {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        padding: 28px 22px;
        text-align: center;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
      }

      .state__art {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        border: 3px solid var(--line-strong);
      }

      .state--loading .state__art {
        border-top-color: var(--primary);
        /* 唯一的动效：缓慢旋转，不闪烁；减少动态时会被关掉 */
        animation: state-spin 1.6s linear infinite;
      }

      @keyframes state-spin {
        to {
          transform: rotate(360deg);
        }
      }

      .state--empty .state__art {
        border-style: dashed;
        border-color: var(--line-strong);
      }

      .state--error .state__art {
        border-color: var(--error-line);
        background: var(--error-soft);
      }

      .state__title {
        margin: 0;
        font-size: 20px;
        font-weight: 700;
      }

      .state__hint {
        margin: 0;
        max-width: 46ch;
        font-size: 16px;
        color: var(--ink-soft);
      }

      .state--error .state__title {
        color: var(--error-ink);
      }

      .state__actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        margin-top: 4px;
      }

      .state__detail {
        width: 100%;
        max-width: 46ch;
        text-align: left;
        font-size: 14px;
        color: var(--ink-faint);
      }

      .state__detail-text {
        margin: 8px 0 0;
        padding: 10px;
        overflow-x: auto;
        font-size: 13px;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 10px;
        white-space: pre-wrap;
      }

      /* ===================== file:// 打开时的提示 ====================== */

      .boot-notice {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 22px;
        background: var(--warn-soft);
        border: 1px solid var(--warn-line);
        border-radius: var(--radius-lg);
        color: var(--warn-ink);
      }

      .boot-notice h2 {
        margin: 0;
        font-size: 20px;
      }

      .boot-notice p {
        margin: 0;
        font-size: 16px;
        line-height: 1.6;
      }

      .boot-notice code {
        padding: 2px 6px;
        font-size: 14px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid var(--warn-line);
        border-radius: 6px;
      }

      /* ============================ 家长说明页 ========================== */

      .consent__list {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .consent__item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 16px 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .consent__item-title {
        font-size: 17px;
        font-weight: 700;
      }

      .consent__item-body {
        font-size: 16px;
        line-height: 1.65;
        color: var(--ink-soft);
      }

      /* 温和提示条：用于摄像头被拒绝/失败时，始终伴随一个出口按钮 */
      .notice {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 16px 18px;
        border-radius: var(--radius);
      }

      .notice--error {
        color: var(--error-ink);
        background: var(--error-soft);
        border: 1px solid var(--error-line);
      }

      .notice__text {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .notice__hint {
        margin: 0;
        font-size: 15px;
        color: var(--ink-soft);
      }

      /* ============================== 长按按钮 ========================== */

      .longpress {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .longpress__btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: var(--tap);
        padding: 14px 26px;
        font: inherit;
        font-size: 16px;
        font-weight: 600;
        color: var(--ink-soft);
        background: var(--surface);
        border: 1px solid var(--line-strong);
        border-radius: 999px;
        cursor: pointer;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }

      .longpress__btn:hover {
        background: var(--surface-soft);
        border-color: var(--primary);
      }

      /* 按住时整颗按钮给出可见反馈，进度条从左侧填满 */
      .longpress__btn[data-holding='true'] {
        border-color: var(--primary);
        color: var(--ink);
      }

      .longpress__track {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: inherit;
        pointer-events: none;
      }

      .longpress__fill {
        display: block;
        width: 100%;
        height: 100%;
        background: var(--primary-soft);
        transform: scaleX(0);
        transform-origin: left center;
        /* 按住期间由 JS 逐帧写 transform，这里不加过渡，避免进度与手指不同步 */
      }

      .longpress__label {
        position: relative;
        z-index: 1;
      }

      .longpress__hint {
        margin: 0;
        font-size: 13px;
        color: var(--ink-faint);
      }

      /* =============================== 家长角 ============================ */

      .settings {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
      }

      .settings__group {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .settings__group-title {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }

      .settings__group-hint,
      .settings__group-note {
        margin: 0;
        font-size: 14px;
        line-height: 1.6;
        color: var(--ink-soft);
      }

      .settings__group-note {
        padding: 10px 12px;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .settings__row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line);
      }

      .settings__row:first-of-type {
        border-top: none;
      }

      .settings__row--stack {
        flex-direction: column;
        align-items: flex-start;
      }

      .settings__row-text {
        display: flex;
        flex-direction: column;
        gap: 2px;
        min-width: 0;
      }

      .settings__row-title {
        font-size: 16px;
        font-weight: 600;
      }

      .settings__row-hint {
        font-size: 14px;
        line-height: 1.55;
        color: var(--ink-soft);
      }

      /* 开关按钮：状态既靠文字也靠背景色，不单靠颜色区分 */
      .toggle {
        flex: none;
        min-width: 72px;
        min-height: 44px;
        padding: 8px 18px;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
        color: var(--ink-soft);
        background: var(--surface-soft);
        border: 2px solid var(--line-strong);
        border-radius: 999px;
        cursor: pointer;
      }

      .toggle--on {
        color: #fff;
        background: var(--primary);
        border-color: var(--primary-strong);
      }

      /* 分段选择器 */
      .segmented {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .segmented__btn {
        flex: 1 1 auto;
        min-height: 48px;
        padding: 10px 16px;
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        color: var(--ink-soft);
        background: var(--surface-soft);
        border: 1px solid var(--line-strong);
        border-radius: 10px;
        cursor: pointer;
      }

      .segmented__btn:hover {
        border-color: var(--primary);
      }

      .segmented__btn--active {
        color: #fff;
        background: var(--primary);
        border-color: var(--primary-strong);
      }

      /* 危险操作（清除记录）：用中性红，不刺眼 */
      .btn--danger {
        color: var(--error-ink);
        background: var(--error-soft);
        border-color: var(--error-line);
      }

      .btn--danger:hover {
        background: #f6e4e0;
      }

      /* 二次确认 */
      .confirm {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 14px;
        background: var(--error-soft);
        border: 1px solid var(--error-line);
        border-radius: var(--radius);
      }

      .confirm__text {
        margin: 0;
        font-size: 15px;
        line-height: 1.6;
        color: var(--error-ink);
      }

      .confirm__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .confirm__actions > .btn {
        flex: 1 1 140px;
      }

      /* 隐私与免责 */
      .privacy {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 18px;
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .privacy__title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
      }

      .privacy__list {
        margin: 0;
        padding-left: 20px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 14px;
        line-height: 1.65;
        color: var(--ink-soft);
      }

      .privacy__body {
        margin: 0;
        font-size: 14px;
        line-height: 1.65;
        color: var(--ink-soft);
      }

      /* ============================ 家长控制条 ========================== */

      /* 组件自身有 display:flex，必须显式让 [hidden] 生效，否则隐藏不掉 */
      [hidden] {
        display: none !important;
      }

      .parentbar {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 18px;
        background: var(--primary-soft);
        border: 2px solid var(--primary);
        border-radius: var(--radius-lg);
      }

      .parentbar__head {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .parentbar__badge {
        flex: none;
        padding: 4px 12px;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        background: var(--primary);
        border-radius: 999px;
      }

      .parentbar__title {
        font-size: 16px;
        font-weight: 600;
        color: var(--primary-strong);
      }

      .parentbar__actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .parentbar__actions > * {
        flex: 1 1 180px;
      }

      .parentbar__finish {
        min-height: var(--tap);
      }

      .parentbar__hint {
        margin: 0;
        font-size: 14px;
        color: var(--ink-soft);
      }

      /* 控制条里的长按按钮用主色，和普通按钮区分开 */
      .parentbar .longpress__btn {
        width: 100%;
        min-height: var(--tap);
        font-size: 17px;
        font-weight: 700;
        color: #fff;
        background: var(--primary);
        border-color: var(--primary-strong);
      }

      .parentbar .longpress__fill {
        background: rgba(255, 255, 255, 0.35);
      }

      .parentbar .longpress__hint {
        display: none;
      }

      /* ============================ 情景练习页 ========================== */

      .scenario-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .scenario-meta__chip {
        padding: 6px 12px;
        font-size: 14px;
        color: var(--ink-soft);
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .scenario-card {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 22px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        box-shadow: var(--shadow);
      }

      .scenario-card__title {
        margin: 0;
        font-size: 21px;
        font-weight: 700;
      }

      .scenario-card__text {
        margin: 0;
        font-size: 17px;
        color: var(--ink-soft);
      }

      .scenario-card__prompt {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }

      .scenario-options {
        display: grid;
        gap: 12px;
        grid-template-columns: 1fr;
      }

      /* 答案卡：热区 ≥ 120px（PRD §6.1） */
      .scenario-option {
        min-height: 96px;
        padding: 18px;
        font: inherit;
        font-size: 17px;
        font-weight: 600;
        text-align: left;
        color: var(--ink);
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: var(--radius);
        cursor: pointer;
      }

      .scenario-option:hover {
        border-color: var(--primary);
      }

      /* 选中的卡（选错时的原卡）：柔和回位感，不用红色 */
      .scenario-option--selected {
        border-color: var(--line-strong);
        background: var(--surface-soft);
      }

      /* 选对 */
      .scenario-option--correct {
        border-color: var(--primary);
        background: var(--primary-soft);
      }

      /* 更合适的选择：高亮但不刺眼 */
      .scenario-option--suggested {
        border-color: var(--warn-line);
        background: var(--warn-soft);
      }

      .scenario-result {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 16px 18px;
        border-radius: var(--radius);
      }

      .scenario-result--ok {
        background: var(--primary-soft);
        border: 1px solid var(--primary);
      }

      .scenario-result--suggest {
        background: var(--warn-soft);
        border: 1px solid var(--warn-line);
      }

      .scenario-result__title {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }

      .scenario-result__body {
        margin: 0;
        font-size: 15px;
        color: var(--ink-soft);
      }

      .notice--info {
        background: var(--surface-soft);
        border: 1px solid var(--line);
      }

      .action-row {
        display: flex;
        gap: 12px;
      }

      .action-row--wrap {
        flex-wrap: wrap;
      }

      .action-row--wrap > .btn {
        flex: 1 1 200px;
      }

      @media (min-width: 768px) {
        .scenario-options {
          grid-template-columns: 1fr 1fr;
        }
      }

      /* ============================== 字幕条 ============================ */

      .captionbar {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 14px 18px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
      }

      .captionbar__label {
        flex: none;
        padding: 2px 10px;
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-soft);
        background: var(--surface-soft);
        border: 1px solid var(--line);
        border-radius: 999px;
      }

      .captionbar__text {
        font-size: 17px;
        line-height: 1.5;
      }

      /* ============================== 光标 ============================== */

      .cursor-layer {
        position: fixed;
        inset: 0;
        z-index: 60;
        pointer-events: none;
      }

      /* 48–56px 圆环（PRD §6.1） */
      .cursor-dot {
        position: absolute;
        width: 52px;
        height: 52px;
        margin: 0;
        border: 3px solid var(--primary);
        border-radius: 50%;
        background: rgba(74, 124, 111, 0.12);
        transform: translate(-50%, -50%);
        transition: background-color 0.12s ease, transform 0.12s ease;
      }

      /* 抓取中：圆环缩小填充，给出明确反馈 */
      .cursor-dot[data-grab='true'] {
        background: rgba(74, 124, 111, 0.55);
        transform: translate(-50%, -50%) scale(0.82);
      }

      /* ========================== 开发用信息 ============================ */

      .scenario-devhint {
        margin: 0;
        font-size: 14px;
        color: var(--ink-faint);
      }

      .scenario-devlog {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 14px 16px;
        background: var(--surface-soft);
        border: 1px dashed var(--line-strong);
        border-radius: var(--radius);
      }

      .scenario-devlog__title {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: var(--ink-soft);
      }

      .scenario-devlog__list {
        margin: 0;
        padding-left: 20px;
        font-size: 13px;
        color: var(--ink-faint);
      }

      /* ============================ 平板/桌面 ========================== */

      /* 平板横屏优先（AI-GUIDE-02 §4.1）：空间够时并排显示，间距更宽松 */
      @media (min-width: 768px) {
        body {
          font-size: 18px;
        }

        .app__main {
          padding: 24px;
        }

        .tiles {
          grid-template-columns: 1fr 1fr;
        }

        .page__heading {
          font-size: 28px;
        }

        .page__heading--xl {
          font-size: 36px;
        }
      }

      @media (min-width: 1100px) {
        .app__main {
          max-width: 1000px;
        }
      }

      /* 很窄的手机：收紧内边距，保证不横向滚动 */
      @media (max-width: 360px) {
        .app__main {
          padding: 12px;
        }

        .btn {
          padding: 14px 16px;
          font-size: 16px;
        }
      }

      /* ======================= 减少动态（PRD §11） ===================== */

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* 高对比度偏好时不依赖背景色区分状态 */
      @media (prefers-contrast: more) {
        .state,
        .tile {
          border-width: 2px;
          border-color: var(--ink);
        }
      }
    </style>
  </head>

  <body>
    <!-- 应用壳挂载点；src/app/main.js 默认就找这个 id -->
    <div id="app"></div>

    <!--
      先挂一个错误监听：如果模块脚本没加载成功（最典型的原因是双击打开、
      走 file:// 协议，Chromium 会用 CORS 拦掉 ES 模块），就显示一段能照做的提示，
      而不是留一个白屏让人以为坏了。
    -->
    <script>
      (function () {
        var shown = false;

        function showBootNotice(reason) {
          if (shown) return;
          shown = true;

          var root = document.getElementById('app');
          if (!root || root.childElementCount > 0) return;

          root.innerHTML =
            '<section class="boot-notice">' +
            '<h2>这一页需要从本地服务器打开</h2>' +
            '<p>检测到脚本没能加载（' +
            reason +
            '）。如果您是直接双击 HTML 文件打开的，浏览器会因为安全策略拦掉 ES 模块。</p>' +
            '<p>在项目根目录执行下面任意一条，然后打开 ' +
            '<code>http://127.0.0.1:8000/demo/shell.html</code>：</p>' +
            '<p><code>python -m http.server 8000</code><br />' +
            '<code>npx serve -l 8000</code><br />' +
            '<code>php -S 127.0.0.1:8000</code></p>' +
            '<p>用 VS Code 的 Live Server 插件，右键本文件选“Open with Live Server”也可以。</p>' +
            '</section>';
        }

        // 模块脚本加载失败会在 script 元素上触发 error（捕获阶段才收得到）。
        window.addEventListener(
          'error',
          function (event) {
            var target = event.target;
            if (target && target.tagName === 'SCRIPT') {
              showBootNotice('脚本加载失败');
            }
          },
          true
        );

        // 兜底：脚本既没成功也没报错时（例如被扩展拦掉），也要给个出路。
        window.addEventListener('load', function () {
          window.setTimeout(function () {
            if (typeof window.__shellApp === 'undefined') {
              showBootNotice('没有找到应用壳实例');
            }
          }, 1200);
        });
      })();
    </script>

    <!-- 应用壳本体。type="module" 才能用 import/export；所以需要服务器环境。 -->
    <script type="module" src="../src/app/main.js"></script>
  </body>
</html>
